[project]
name = "ask_hn_digest"
version = "0.1.1"
description = "Get Summaries of the most engaging discussions on Hacker News"
authors = [{ name = "Rasul Kireev", email = "me@rasulkireev.com" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "django-allauth[socialaccount]>=64.0.0,<65.0.0",
    "python-webpack-boilerplate>=1.0.0,<2.0.0",
    "django-widget-tweaks>=1.4.12,<2.0.0",
    "mkdocstrings>=0.20.0,<0.21.0",
    "django>=5.0.4,<6.0.0",
    "django-environ>=0.11.2,<0.12.0",
    "psycopg2>=2.9.9,<3.0.0",
    "ipython>=8.27.0,<9.0.0",
    "django-extensions>=3.2.3,<4.0.0",
    "pillow>=10.4.0,<11.0.0",
    "django-q2>=1.7.2,<2.0.0",
    "whitenoise>=6.7.0,<7.0.0",
    "django-storages[s3]>=1.14.4,<2.0.0",
    "structlog>=24.4.0,<25.0.0",
    "django-structlog>=8.1.0,<9.0.0",
    "markdown>=3.7,<4.0.0",
    "sentry-sdk[django]>=2.14.0,<3.0.0",
    "structlog-sentry>=2.2.1,<3.0.0",
    "gunicorn>=23.0.0,<24.0.0",
    "pytest>=8.3.3,<9.0.0",
    "pytest-django>=4.9.0,<5.0.0",
    "redis>=5.0.8,<6.0.0",
    "django-anymail[mailgun]>=12.0,<13.0",
    "posthog>=3.6.6,<4.0.0",
    "django-ninja>=1.3.0,<2.0.0",
    "django-mjml>=1.3,<2.0.0",
    "logfire>=3.6.4,<4.0.0",
    "pydantic[email]>=2.11.4,<3.0.0",
    "google-genai>=1.14.0,<2.0.0",
    "aiohttp>=3.12.14,<4.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "requests>=2.32.4,<3.0.0",
    "croniter>=6.0.0,<7.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.2.1,<4.0.0",
    "ty>=0.0.1a7,<0.0.2",
    "ruff>=0.11.11,<0.12.0",
    "djlint>=1.36.4,<2.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # isort
    "DJ",   # django-specific rules
    "UP",   # pyupgrade
    "C90",  # mccabe complexity
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "F401", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"

[tool.djlint]
profile="django"
ignore = "H031,H006,H023,H021,H011,T002"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
