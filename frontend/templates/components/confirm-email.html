{% if not email_verified %}
    <div class="rounded-[2px] border border-yellow-600/40 bg-warning-soft p-4">
        <div class="flex">
            <div class="flex-shrink-0">
                <svg class="w-5 h-5"
                     xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 20 20"
                     fill="currentColor"
                     aria-hidden="true">
                    <path fill-rule="evenodd" d="M8.485 3.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 3.495zM10 6a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 6zm0 9a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
                </svg>
            </div>
            <div class="ml-3">
                <h3 class="text-sm font-black text-warning">Confirm your email</h3>
                <div>
                    <form method="post" action="{{ resend_confirmation_url }}">
                        {% csrf_token %}
                        <p class="mt-1 text-sm leading-relaxed text-warning">
                            Your email is not yet confirmed. Some account features may be limited until it is verified.
                        </p>
                        <p class="mt-1 text-sm leading-relaxed text-warning">
                            If the confirmation email did not arrive,
                            <button type="submit"
                                    class="font-extrabold text-cobalt underline underline-offset-[0.18em] transition hover:text-accent-dark">
                                send it again
                            </button>
                            .
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endif %}
