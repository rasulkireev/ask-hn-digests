{% extends 'base.html' %}
{% load widget_tweaks %}
{% block content %}
    <section class="mx-auto max-w-lg px-4 py-12 sm:py-20">
        <div class="rounded-[2px] border border-line bg-paper/95 p-5 shadow-low sm:p-8">
            <h1 class="text-[2.3rem] font-black leading-none tracking-normal sm:text-5xl">Sign out?</h1>
            <p class="my-5 leading-relaxed text-muted">Confirm that you want to leave this account session.</p>
            <form method="post"
                  class="mt-6 flex flex-wrap items-center gap-3"
                  action="{% url 'account_logout' %}">
                {% csrf_token %}
                {% if redirect_field_value %}
                    <input type="hidden"
                           name="{{ redirect_field_name }}"
                           value="{{ redirect_field_value }}" />
                {% endif %}
                <button class="inline-flex min-h-[2.7rem] items-center justify-center gap-2 rounded-[2px] border border-danger bg-danger px-4 text-[0.92rem] font-extrabold leading-none text-paper no-underline transition focus:outline-none focus:ring-4 focus:ring-accent/20"
                        type="submit">Sign out</button>
            </form>
        </div>
    </section>
{% endblock content %}
